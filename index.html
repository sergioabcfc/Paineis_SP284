<!DOCTYPE html>
<html lang="pt-BR">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f3f2f1;--card:#ffffff;--line:#d8d6d3;
  --ink:#2B2A29;--ink-2:#727271;--blue:#2C3370;--on-blue:#ffffff;
  --font:'Montserrat',sans-serif;--mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;}
#authGate{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center;}
#authBox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:32px;width:320px;max-width:90vw;box-shadow:0 4px 24px rgba(0,0,0,.08);}
#authBox h2{margin:0 0 4px;color:var(--blue);font-size:20px;}
#authBox p{margin:0 0 20px;color:var(--ink-2);font-size:13px;}
#authBox input{width:100%;box-sizing:border-box;padding:10px;margin-bottom:8px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:14px;}
#capsLockAviso{display:none;margin-bottom:10px;font-size:12px;color:#b33;}
#authBtn{width:100%;font-family:var(--font);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.3px;padding:10px 16px;border:1px solid var(--blue);background:var(--blue);color:#fff;cursor:pointer;border-radius:8px;}
#authMsg{margin-top:10px;font-size:12px;color:#b33;min-height:16px;}

#app{display:none;height:100vh;flex-direction:column;}
#miniBar{flex:none;background:var(--card);border-bottom:1px solid var(--line);padding:6px 14px;display:flex;align-items:center;gap:14px;}
#miniBar span{font-size:11px;color:var(--ink-2);font-family:var(--mono);}
#miniBar a{font-size:11px;color:var(--blue);text-decoration:none;cursor:pointer;margin-left:auto;}
#miniBar a:hover{text-decoration:underline;}
#status{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--mono);font-size:.8rem;color:var(--ink-2);}
#loadBox{position:relative;width:96px;height:96px;margin-bottom:18px;}
#loadBoxBg,#loadBoxFill{position:absolute;inset:0;}
#loadBoxBg{color:var(--line);}
#loadBoxFill{color:var(--blue);clip-path:inset(100% 0 0 0);transition:clip-path .2s ease-out;}
#loadBoxBg svg,#loadBoxFill svg{width:100%;height:100%;display:block;}
#loadPct{font-size:1rem;font-weight:700;color:var(--blue);margin-bottom:2px;}
#loadSub{font-size:.7rem;color:var(--ink-2);margin-top:6px;opacity:.8;}
#viewerFrame{flex:1;border:none;width:100%;display:none;}
</style>
</head>
<body>

<div id="authGate">
  <div id="authBox">
    <h2>SP-284 · Painéis</h2>
    <p>Acesso restrito — entre com seu e-mail e senha cadastrados.</p>
    <input id="authEmail" type="email" placeholder="E-mail" autocomplete="username">
    <input id="authSenha" type="password" placeholder="Senha" autocomplete="current-password">
    <div id="capsLockAviso">⚠ Caps Lock ativado</div>
    <button id="authBtn">Entrar</button>
    <div id="authMsg"></div>
  </div>
</div>

<div id="app">
  <div id="miniBar">
    <span id="usuarioLogado"></span>
    <a href="#" onclick="sair(); return false;">Sair</a>
  </div>
  <div id="status">
    <div id="loadBox">
      <div id="loadBoxBg"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><defs><clipPath id="tclipBg"><path d="M8,14 H92 V34 H60 V92 H40 V34 H8 Z"/></clipPath></defs><path d="M8,14 H92 V34 H60 V92 H40 V34 H8 Z" fill="currentColor"/><g clip-path="url(#tclipBg)"><rect x="-20" y="40" width="140" height="18" fill="currentColor" opacity=".4" transform="rotate(-18 50 50)"/></g></svg></div>
      <div id="loadBoxFill"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><defs><clipPath id="tclipFill"><path d="M8,14 H92 V34 H60 V92 H40 V34 H8 Z"/></clipPath></defs><path d="M8,14 H92 V34 H60 V92 H40 V34 H8 Z" fill="currentColor"/><g clip-path="url(#tclipFill)"><rect x="-20" y="40" width="140" height="18" fill="currentColor" opacity=".4" transform="rotate(-18 50 50)"/></g></svg></div>
    </div>
    <div id="loadPct">0%</div>
    <div id="loadMsg">Carregando painel…</div>
    <div id="loadSub">Arquivo grande — pode levar alguns segundos na primeira vez</div>
  </div>
  <iframe id="viewerFrame"></iframe>
</div>

<script>
/* ===================== CONFIG ===================== */
const SUPABASE_URL = 'https://iedkkjqgwuuxdjqpqzqa.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_7adJjNYdTC7wNj2aCh3RvQ_NPqVSINv';
const BUCKET = 'paineis';
const ARQUIVO_HUB = 'Painel_SP-284.html';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let blobUrlAtual = null;
let perfilAtual = null;

function mostrarApp(){
  document.getElementById('authGate').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
}

async function carregarPerfil(userId){
  const { data, error } = await sb.from('profiles').select('papel,nome').eq('id', userId).maybeSingle();
  if(error || !data) return null;
  return data;
}

function atualizarProgresso(pct){
  pct = Math.max(0, Math.min(100, pct));
  const fill = document.getElementById('loadBoxFill');
  const pctEl = document.getElementById('loadPct');
  if(fill) fill.style.clipPath = 'inset(' + (100 - pct) + '% 0 0 0)';
  if(pctEl) pctEl.textContent = Math.round(pct) + '%';
}

async function abrirHub(){
  const statusEl = document.getElementById('status');
  const msgEl = document.getElementById('loadMsg');
  statusEl.style.display = 'flex';
  atualizarProgresso(0);

  let chunks, contentType;
  try{
    const { data: { session } } = await sb.auth.getSession();
    const resp = await fetch(
      SUPABASE_URL + '/storage/v1/object/authenticated/' + BUCKET + '/' + encodeURIComponent(ARQUIVO_HUB),
      { headers: { 'Authorization': 'Bearer ' + (session ? session.access_token : ''), 'apikey': SUPABASE_ANON_KEY } }
    );
    if(!resp.ok || !resp.body) throw new Error('HTTP ' + resp.status);
    contentType = resp.headers.get('Content-Type') || 'text/html';
    const total = parseInt(resp.headers.get('Content-Length') || '0', 10);
    const reader = resp.body.getReader();
    chunks = [];
    let recebido = 0;
    let simulado = 0;
    const simTimer = total ? null : setInterval(function(){
      // Sem Content-Length pra calcular % real: avança devagar até 90% e espera o download real terminar.
      simulado = Math.min(90, simulado + 2);
      atualizarProgresso(simulado);
    }, 300);
    while(true){
      const { done, value } = await reader.read();
      if(done) break;
      chunks.push(value);
      recebido += value.length;
      if(total) atualizarProgresso(recebido / total * 100);
    }
    if(simTimer) clearInterval(simTimer);
    atualizarProgresso(100);
  }catch(err){
    if(msgEl) msgEl.textContent = 'Erro ao carregar: ' + (err && err.message ? err.message : err);
    return;
  }

  // Força o tipo certo — sem isso o navegador às vezes mostra o código-fonte em vez de renderizar.
  const blob = new Blob(chunks, { type: 'text/html' });
  if(blobUrlAtual) URL.revokeObjectURL(blobUrlAtual);
  blobUrlAtual = URL.createObjectURL(blob);
  const frame = document.getElementById('viewerFrame');

  // Avisa o Hub que quem está vendo já passou pelo login aqui no loader — o Hub não faz
  // uma nova checagem de sessão (o arquivo carregado como blob: tem origem "null", e a
  // API do Supabase rejeita chamadas de autenticação vindas dessa origem com erro 403).
  frame.onload = function(){
    statusEl.style.display = 'none';
    frame.style.display = 'block';
    frame.contentWindow.postMessage({ __acessoLiberado: {
      nome: perfilAtual ? perfilAtual.nome : '',
      papel: perfilAtual ? perfilAtual.papel : 'consulta'
    }}, '*');
  };
  frame.src = blobUrlAtual;
}

function sair(){
  sb.auth.signOut().then(()=>location.reload());
}

async function iniciarAposLogin(){
  const { data: { user } } = await sb.auth.getUser();
  if(!user) return false;
  const perfil = await carregarPerfil(user.id);
  if(!perfil){
    document.getElementById('authMsg').textContent = 'Seu usuário não tem permissão. Fale com o administrador.';
    await sb.auth.signOut();
    return false;
  }
  perfilAtual = perfil;
  document.getElementById('usuarioLogado').textContent = (perfil.nome||'') + ' · ' + (perfil.papel==='editor'?'Editor':'Consulta');
  mostrarApp();
  abrirHub();
  return true;
}

document.getElementById('authSenha').addEventListener('keyup', function(e){
  const ligado = e.getModifierState && e.getModifierState('CapsLock');
  document.getElementById('capsLockAviso').style.display = ligado ? '' : 'none';
});

document.getElementById('authBtn').addEventListener('click', async ()=>{
  const email = document.getElementById('authEmail').value.trim();
  const senha = document.getElementById('authSenha').value;
  const msgEl = document.getElementById('authMsg');
  msgEl.style.color = 'var(--ink-2)'; msgEl.textContent = 'Entrando...';
  const { error } = await sb.auth.signInWithPassword({ email, password: senha });
  if(error){ msgEl.style.color = '#b33'; msgEl.textContent = 'E-mail ou senha inválidos.'; return; }
  msgEl.textContent = '';
  iniciarAposLogin();
});

sb.auth.getSession().then(({ data: { session } })=>{
  if(session){ iniciarAposLogin(); }
});
</script>
</body>
</html>
